[pytest]
testpaths = tests
filterwarnings =
    # Pre-existing: models.py uses datetime.utcnow as a column default. Tracked
    # separately from the test work; silence so the suite output stays readable.
    ignore:datetime.datetime.utcnow:DeprecationWarning
    # Pre-existing: get_or_404 / load_user use the legacy Query.get() internally.
    ignore:The Query.get\(\) method is considered legacy:DeprecationWarning
